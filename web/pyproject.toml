[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tm-observer"
version = "0.1.0"
description = "Sciver research observability and operator controls"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
tm-observer = "tm_observer.cli:main"

[tool.setuptools]
packages = ["tm_observer"]

[tool.setuptools.package-data]
tm_observer = ["static/*.svg", "*.js", "vendor/*.js", "research_chat_dist/*", "workflow_versions/*.json"]
