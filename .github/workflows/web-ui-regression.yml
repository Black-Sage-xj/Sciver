name: Sciver Web UI regression

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  web-ui:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/research_chat_frontend/package-lock.json
      - name: Install deterministic test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]" -e ./web
      - name: Python compile check
        run: python -m compileall -q theory_master web/tm_observer
      - name: Install actual browser test runtime
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium firefox
      - name: Web regression tests
        run: python -m pytest -q web/tests
      - name: Exercise settings and Worker controls in browsers
        env:
          TM_BROWSER_E2E: '1'
          DEBUG: pw:browser
        run: python -m pytest -q web/tests/test_settings_browser.py web/tests/test_worker_close_browser_20261116.py web/tests/test_webui_browser_smoke_20261018.py
      - name: Build and validate Research Chat frontend
        working-directory: web/research_chat_frontend
        run: |
          npm ci
          npm run typecheck
          npm run test:markdown
          npm run build
          node --check ../tm_observer/research_chat_dist/research-chat.js
      - name: Ensure checked-in frontend JavaScript bundle matches source
        run: git diff --exit-code -- web/tm_observer/research_chat_dist/research-chat.js
