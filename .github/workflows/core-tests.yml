name: Sciver core tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  core-tests:
    name: Deterministic core test gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/web
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]" -e ./web
      - name: Keep Chinese and English READMEs aligned
        run: python scripts/check_readme_sync.py --changed-from HEAD^
      - name: Validate known-failure quarantine
        run: python scripts/test_profiles.py list
      - name: Validate complete test inventory
        run: python scripts/run_tests.py --list
      - name: Compile SDK and Web Python packages
        run: python -m compileall -q theory_master web/tm_observer
      - name: Check public tree and new history
        env:
          SCIVER_RELEASE_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -n "$SCIVER_RELEASE_BASE" ] && [ "$SCIVER_RELEASE_BASE" != "0000000000000000000000000000000000000000" ]; then
            SCIVER_RELEASE_ANCHOR=$(git merge-base "$SCIVER_RELEASE_BASE" HEAD)
            python scripts/public_release_guard.py --ref HEAD --base "$SCIVER_RELEASE_ANCHOR"
          else
            python scripts/public_release_guard.py --ref HEAD
          fi
      - name: Run deterministic core tests
        run: python scripts/run_tests.py -q
      - name: Verify installed wheels and Test0 Web startup
        run: |
          python -m pip wheel --no-deps --wheel-dir "$RUNNER_TEMP/sciver-wheels" . ./web
          python -m venv "$RUNNER_TEMP/sciver-smoke"
          "$RUNNER_TEMP/sciver-smoke/bin/python" -I -m pip install "$RUNNER_TEMP/sciver-wheels/"*.whl
          python scripts/smoke_install.py --python "$RUNNER_TEMP/sciver-smoke/bin/python"
