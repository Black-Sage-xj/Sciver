<g transform="translate(400 250) scale(.32)"><path d="M0 87 L147 0 L147 64 L60 117 Z" fill="#408EF7"/><path d="M0 87 L60 117 L0 150 Z" fill="#1D4BC7"/><path d="M0 150 L60 117 L117 212 Z" fill="#2151BF"/><path d="M60 117 L181 179 L117 212 Z" fill="#47A2F7"/><path d="M187 180 L187 249 L123 216 Z" fill="#245AF1"/><path d="M42 259 L123 216 L91 299 L42 326 Z" fill="#1762F5"/><path d="M123 216 L187 249 L91 299 Z" fill="#1A45BB"/></g>
<text x="400" y="375" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#08162C">64 px</text><text x="400" y="405" font-family="Arial,sans-serif" font-size="16" fill="#52627C">Full-color</text>
<g transform="translate(655 290) scale(.22)"><path d="M0 87 L147 0 L147 64 L60 117 Z" fill="#1762F5"/><path d="M0 87 L60 117 L0 150 Z" fill="#1762F5"/><path d="M0 150 L60 117 L117 212 Z" fill="#1762F5"/><path d="M60 117 L181 179 L117 212 Z" fill="#1762F5"/><path d="M187 180 L187 249 L123 216 Z" fill="#1762F5"/><path d="M42 259 L123 216 L91 299 L42 326 Z" fill="#1762F5"/><path d="M123 216 L187 249 L91 299 Z" fill="#1762F5"/></g>
