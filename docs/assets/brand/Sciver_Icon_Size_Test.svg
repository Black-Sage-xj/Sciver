<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 600" role="img" aria-labelledby="title desc">
<title id="title">Sciver icon-size preview</title><desc id="desc">The Sciver A2 symbol shown at progressively smaller pixel sizes to demonstrate small-size legibility.</desc>
<rect width="1400" height="600" rx="30" fill="#F4F7FC"/>
<text x="64" y="68" font-family="Arial,sans-serif" font-size="18" letter-spacing="4" fill="#52627C">SCIVER / ICON SIZE TEST</text>
<text x="64" y="116" font-family="Arial,sans-serif" font-size="36" font-weight="700" fill="#08162C">Choose the right mark for the display size.</text>
<g transform="translate(125 185) scale(.48)"><path d="M0 87 L147 0 L147 64 L60 117 Z" fill="#408EF7"/><path d="M0 87 L60 117 L0 150 Z" fill="#1D4BC7"/><path d="M0 150 L60 117 L117 212 Z" fill="#2151BF"/><path d="M60 117 L181 179 L117 212 Z" fill="#47A2F7"/><path d="M187 180 L187 249 L123 216 Z" fill="#245AF1"/><path d="M42 259 L123 216 L91 299 L42 326 Z" fill="#1762F5"/><path d="M123 216 L187 249 L91 299 Z" fill="#1A45BB"/></g>
