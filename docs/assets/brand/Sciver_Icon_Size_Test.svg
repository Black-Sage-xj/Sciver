<g transform="translate(1140 340) scale(.10)" fill="#08162C"><path d="M0 87 L147 0 L147 64 L60 117 Z"/><path d="M0 87 L60 117 L0 150 Z"/><path d="M0 150 L60 117 L117 212 Z"/><path d="M60 117 L181 179 L117 212 Z"/><path d="M187 180 L187 249 L123 216 Z"/><path d="M42 259 L123 216 L91 299 L42 326 Z"/><path d="M123 216 L187 249 L91 299 Z"/></g>
