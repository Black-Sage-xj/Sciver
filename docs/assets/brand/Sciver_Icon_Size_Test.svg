<rect x="64" y="470" width="1272" height="70" rx="16" fill="#FFFFFF" stroke="#E1E7F0" stroke-width="2"/>
<text x="92" y="513" font-family="Arial,sans-serif" font-size="17" fill="#52627C">Guidance: use the full-color mark at 48 px and above; prefer a single-color mark at smaller sizes.</text>
