<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1100" viewBox="0 0 1800 1100" role="img" aria-labelledby="title desc"><title id="title">Sciver System Architecture</title><desc id="desc">A multi-agent workflow engine for long-horizon scientific research</desc><defs><style>text{font-family:Inter,"Noto Sans CJK SC","Microsoft YaHei",Arial,sans-serif;fill:#182b49}.title{font-size:39px;font-weight:750}.sub{font-size:18px;fill:#5d6d83}.head{font-size:20px;font-weight:720}.label{font-size:14px;font-weight:680}.body{font-size:12px;fill:#5d6d83}.step{font-size:12px;font-weight:680}.small{font-size:11px;fill:#5d6d83}</style><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#9bacc1"/></marker></defs><rect width="1800" height="1100" fill="#f5f7fb"/><rect width="1800" height="105" fill="white"/><rect x="64" y="26" width="7" height="54" rx="3" fill="#3569d4"/><text x="92" y="57" class="title">Sciver System Architecture</text><text x="94" y="84" class="sub">A multi-agent workflow engine for long-horizon scientific research</text><line x1="64" y1="105" x2="1736" y2="105" stroke="#dce4ef"/><rect x="64" y="126" width="1672" height="116" rx="11" fill="white" stroke="#dce4ef" stroke-width="1.4"/><rect x="64" y="126" width="1672" height="6" rx="3" fill="#3569d4"/><text x="84" y="160" class="head">Research Inputs &amp; Long-Term Knowledge</text><text x="84" y="180" class="body">Goals, constraints, and current scientific understanding</text><rect x="84" y="188" width="260" height="38" rx="8" fill="#edf3ff" stroke="#c8d8f3" stroke-width="1.4"/><text x="96" y="212" class="label">Research Plan</text><rect x="364" y="188" width="330" height="38" rx="8" fill="#edf3ff" stroke="#c8d8f3" stroke-width="1.4"/><text x="376" y="212" class="label">Goal / Research Contract</text><rect x="714" y="188" width="200" height="38" rx="8" fill="#edf3ff" stroke="#c8d8f3" stroke-width="1.4"/><text x="726" y="212" class="label">Final Gate</text><rect x="934" y="188" width="290" height="38" rx="8" fill="#edf3ff" stroke="#c8d8f3" stroke-width="1.4"/><text x="946" y="212" class="label">Scientific Model</text><rect x="1244" y="188" width="470" height="38" rx="8" fill="#e9f7f4" stroke="#b6ddd7" stroke-width="1.4"/><text x="1256" y="212" class="label">SQLite Science Graph</text><path d="M900 242 L900 263" fill="none" stroke="#9bacc1" stroke-width="2" marker-end="url(#a)"/><rect x="64" y="272" width="500" height="292" rx="11" fill="white" stroke="#dce4ef" stroke-width="1.4"/><rect x="64" y="272" width="500" height="6" rx="3" fill="#3569d4"/><text x="84" y="306" class="head">Layer A · Scientific Agents</text><rect x="84" y="324" width="218" height="58" rx="9" fill="#edf3ff" stroke="#c8d8f3" stroke-width="1.4"/><text x="96" y="346" class="label">Research Lead</text><text x="96" y="366" class="body">Candidates · synthesis · frontiers</text><rect x="318" y="324" width="226" height="58" rx="9" fill="#edf3ff" stroke="#c8d8f3" stroke-width="1.4"/><text x="330" y="346" class="label">Challenger</text><text x="330" y="366" class="body">Qualification · revision review</text><rect x="84" y="393" width="218" height="58" rx="9" fill="#e9f7f4" stroke="#b6ddd7" stroke-width="1.4"/><text x="96" y="415" class="label">Investigator</text><text x="96" y="435" class="body">Theory · computation · tools · materials</text><rect x="318" y="393" width="226" height="58" rx="9" fill="#fff5e6" stroke="#f0d4a5" stroke-width="1.4"/><text x="330" y="415" class="label">Judge</text><text x="330" y="435" class="body">Independent locked-hypothesis review</text><rect x="84" y="462" width="218" height="42" rx="9" fill="#f2eeff" stroke="#d6cafa" stroke-width="1.4"/><text x="96" y="484" class="label">Literature · source verification</text><rect x="318" y="462" width="226" height="42" rx="9" fill="#f2eeff" stroke="#d6cafa" stroke-width="1.4"/><text x="330" y="484" class="label">Reporter · reports and summaries</text><text x="84" y="535" class="body">Scientific roles do not directly mutate runtime state</text><rect x="584" y="272" width="650" height="292" rx="11" fill="white" stroke="#dce4ef" stroke-width="1.4"/><rect x="584" y="272" width="650" height="6" rx="3" fill="#138b83"/><text x="604" y="306" class="head">Layer C · SDK / Workflow Engine</text><text x="604" y="326" class="body">Orchestration, contract validation, commits, and recovery</text><rect x="604" y="324" width="285" height="48" rx="9" fill="#edf3ff" stroke="#c8d8f3" stroke-width="1.4"/><text x="616" y="346" class="label">Stage scheduling &amp; prompt assembly</text><rect x="904" y="324" width="310" height="48" rx="9" fill="#edf3ff" stroke="#c8d8f3" stroke-width="1.4"/><text x="916" y="346" class="label">Output contract / schema validation</text><path d="M889 348 L900 348" fill="none" stroke="#9bacc1" stroke-width="2" marker-end="url(#a)"/><rect x="604" y="385" width="190" height="49" rx="9" fill="#f2eeff" stroke="#d6cafa" stroke-width="1.4"/><text x="616" y="407" class="label">Hypothesis Lock</text><rect x="806" y="385" width="190" height="49" rx="9" fill="#e9f7f4" stroke="#b6ddd7" stroke-width="1.4"/><text x="818" y="407" class="label">Evidence Registry</text><rect x="1008" y="385" width="206" height="49" rx="9" fill="#edf3ff" stroke="#c8d8f3" stroke-width="1.4"/><text x="1020" y="407" class="label">Invocation Ledger</text><path d="M794 409 L802 409" fill="none" stroke="#9bacc1" stroke-width="2" marker-end="url(#a)"/><path d="M996 409 L1004 409" fill="none" stroke="#9bacc1" stroke-width="2" marker-end="url(#a)"/><rect x="604" y="447" width="285" height="49" rx="9" fill="#e9f7f4" stroke="#b6ddd7" stroke-width="1.4"/><text x="616" y="469" class="label">Scientific Model Commit</text><rect x="904" y="447" width="310" height="49" rx="9" fill="#edf3ff" stroke="#c8d8f3" stroke-width="1.4"/><text x="916" y="469" class="label">Checkpoint &amp; Recovery</text><path d="M1110 434 L1110 443" fill="none" stroke="#9bacc1" stroke-width="2" marker-end="url(#a)"/><path d="M889 471 L900 471" fill="none" stroke="#9bacc1" stroke-width="2" marker-end="url(#a)"/><path d="M564 413 L580 413" fill="none" stroke="#9bacc1" stroke-width="2" marker-end="url(#a)"/><rect x="1254" y="272" width="482" height="292" rx="11" fill="white" stroke="#dce4ef" stroke-width="1.4"/><rect x="1254" y="272" width="482" height="6" rx="3" fill="#7659c8"/><text x="1274" y="306" class="head">Supporting Capabilities &amp; Runtime Boundaries</text><rect x="1274" y="324" width="442" height="70" rx="9" fill="#f2eeff" stroke="#d6cafa" stroke-width="1.4"/><text x="1286" y="346" class="label">Layer B · Semantic Annotator</text><text x="1286" y="366" class="body">Maps within closed choices; creates no evidence or scientific verdicts</text><rect x="1274" y="407" width="442" height="62" rx="9" fill="#f7f8fc" stroke="#dce4ef" stroke-width="1.4"/><text x="1286" y="429" class="label">Supervisor · fault diagnosis, controlled repair, recovery verification</text><text x="1287" y="489" class="body">Does not override scientific contracts or replace the Judge</text><path d="M1234 413 L1250 413" fill="none" stroke="#9bacc1" stroke-width="2" marker-end="url(#a)"/><path d="M900 564 L900 585" fill="none" stroke="#9bacc1" stroke-width="2" marker-end="url(#a)"/><rect x="64" y="596" width="1672" height="112" rx="11" fill="white" stroke="#dce4ef" stroke-width="1.4"/><rect x="64" y="596" width="1672" height="6" rx="3" fill="#3569d4"/><text x="84" y="630" class="head">Persistence &amp; Control Plane</text><text x="84" y="650" class="body">SQLite is authoritative; Canvas and Web are presentation projections</text><rect x="84" y="656" width="390" height="38" rx="8" fill="#e9f7f4" stroke="#b6ddd7" stroke-width="1.4"/><text x="96" y="672" class="label">science_graph.sqlite3</text><text x="96" y="690" class="small">H · External · lineage · frontier · Cycle Outcome</text><rect x="488" y="656" width="350" height="38" rx="8" fill="#edf3ff" stroke="#c8d8f3" stroke-width="1.4"/><text x="500" y="672" class="label">Evidence &amp; Artifacts</text><text x="500" y="690" class="small">Provenance, hashes, reports, reproducibility</text><rect x="858" y="656" width="300" height="38" rx="8" fill="#edf3ff" stroke="#c8d8f3" stroke-width="1.4"/><text x="870" y="672" class="label">Web UI / TUI</text><text x="870" y="690" class="small">Runtime status, graphs, and records</text><rect x="1178" y="656" width="536" height="38" rx="8" fill="#f2eeff" stroke="#d6cafa" stroke-width="1.4"/><text x="1190" y="672" class="label">Canvas / Notes</text><text x="1190" y="690" class="small">Read-only or rebuildable projections</text><text x="64" y="755" class="head">Scientific Workflow of a Cycle</text><text x="1736" y="755" class="small" text-anchor="end">Cycle closure is distinct from task completion</text><rect x="64" y="780" width="198" height="91" rx="9" fill="#edf3ff" stroke="#c8d8f3" stroke-width="1.4"/><circle cx="81" cy="798" r="10" fill="#3569d4"/><text x="81" y="802" class="small" text-anchor="middle">1</text><text x="96" y="802" class="step">Lead: frontier_proposal</text><text x="76" y="837" class="body">Propose hypotheses</text><path d="M262 825 L271 825" fill="none" stroke="#9bacc1" stroke-width="2" marker-end="url(#a)"/><rect x="274" y="780" width="198" height="91" rx="9" fill="#edf3ff" stroke="#c8d8f3" stroke-width="1.4"/><circle cx="291" cy="798" r="10" fill="#3569d4"/><text x="291" y="802" class="small" text-anchor="middle">2</text><text x="306" y="802" class="step">Challenger: candidate_review</text><text x="286" y="837" class="body">Qualify and verify revisions</text><path d="M472 825 L481 825" fill="none" stroke="#9bacc1" stroke-width="2" marker-end="url(#a)"/><rect x="484" y="780" width="198" height="91" rx="9" fill="#f2eeff" stroke="#d6cafa" stroke-width="1.4"/><circle cx="501" cy="798" r="10" fill="#7659c8"/><text x="501" y="802" class="small" text-anchor="middle">3</text><text x="516" y="802" class="step">SDK: Hypothesis Lock</text><text x="496" y="837" class="body">Freeze hypothesis and test</text><path d="M682 825 L691 825" fill="none" stroke="#9bacc1" stroke-width="2" marker-end="url(#a)"/><rect x="694" y="780" width="198" height="91" rx="9" fill="#e9f7f4" stroke="#b6ddd7" stroke-width="1.4"/><circle cx="711" cy="798" r="10" fill="#138b83"/><text x="711" y="802" class="small" text-anchor="middle">4</text><text x="726" y="802" class="step">Investigator: investigate</text><text x="706" y="837" class="body">Investigate and register evidence</text><path d="M892 825 L901 825" fill="none" stroke="#9bacc1" stroke-width="2" marker-end="url(#a)"/><rect x="904" y="780" width="198" height="91" rx="9" fill="#fff5e6" stroke="#f0d4a5" stroke-width="1.4"/><circle cx="921" cy="798" r="10" fill="#b87a22"/><text x="921" y="802" class="small" text-anchor="middle">5</text><text x="936" y="802" class="step">Judge: terminal_assessment</text><text x="916" y="837" class="body">Assess the locked hypothesis</text><path d="M1102 825 L1111 825" fill="none" stroke="#9bacc1" stroke-width="2" marker-end="url(#a)"/><rect x="1114" y="780" width="198" height="91" rx="9" fill="#edf3ff" stroke="#c8d8f3" stroke-width="1.4"/><circle cx="1131" cy="798" r="10" fill="#3569d4"/><text x="1131" y="802" class="small" text-anchor="middle">6</text><text x="1146" y="802" class="step">Lead: cycle_synthesis</text><text x="1126" y="837" class="body">Synthesize findings and frontier</text><path d="M1312 825 L1321 825" fill="none" stroke="#9bacc1" stroke-width="2" marker-end="url(#a)"/><rect x="1324" y="780" width="198" height="91" rx="9" fill="#f2eeff" stroke="#d6cafa" stroke-width="1.4"/><circle cx="1341" cy="798" r="10" fill="#7659c8"/><text x="1341" y="802" class="small" text-anchor="middle">7</text><text x="1356" y="802" class="step">Reporter / Projection</text><text x="1336" y="837" class="body">Report and update projections</text><path d="M1522 825 L1531 825" fill="none" stroke="#9bacc1" stroke-width="2" marker-end="url(#a)"/><rect x="1534" y="780" width="198" height="91" rx="9" fill="#e9f7f4" stroke="#b6ddd7" stroke-width="1.4"/><circle cx="1551" cy="798" r="10" fill="#138b83"/><text x="1551" y="802" class="small" text-anchor="middle">8</text><text x="1566" y="802" class="step">Goal Completion / Next Cycle</text><text x="1546" y="837" class="body">Complete the goal or continue</text><rect x="64" y="895" width="1672" height="104" rx="13" fill="white" stroke="#dce4ef" stroke-width="1.4"/><text x="86" y="926" class="label">Key distinctions:</text><text x="86" y="960" class="body">Hypothesis Lock: freezes this cycle's claim</text><text x="630" y="960" class="body">Cycle Outcome: this cycle's terminal verdict</text><text x="1195" y="960" class="body">Goal Completion: task-level decision</text></svg>